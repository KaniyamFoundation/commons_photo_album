<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Commons Photo Album</title>
    <script>
      // Single Page Apps for GitHub Pages redirect script
      // Preserves path and query into hash
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var repoName = l.pathname.split('/')[1];
      // If deployed in a subdirectory like /repo-name/
      var newPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        (repoName && !repoName.includes('.') ? '/' + repoName + '/' : '/') +
        '#/' + newPath + (l.search ? '?' + l.search.slice(1) : '') + l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
